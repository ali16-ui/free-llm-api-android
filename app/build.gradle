plugins { id 'com.android.application' }
android {
    namespace 'app.freellmapi.webview'
    compileSdk 34
    defaultConfig {
        applicationId 'app.freellmapi.webview'
        minSdk 33          // Android 13+
        targetSdk 34
        versionCode 1
        versionName '0.16.19'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
// No third-party dependencies on purpose: fewer things to fail at build time.
